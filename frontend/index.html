<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9f9ff"/><meta name="description" content="Discover hidden India. Save places, plan your next escape, and collect memories in your Wanderer passport."/><title>Wanderer — Take the road less known</title>
    
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem('wanderer-preferences') || '{}')?.theme;
        const dark = theme === 'dark' || (!['light', 'dark'].includes(theme) && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;1,500&display=swap" rel="stylesheet">
  </head>
