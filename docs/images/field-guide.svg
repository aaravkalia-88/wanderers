  <g fill="#174b49" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2"><text x="50" y="498">DISCOVER → RESEARCH → EXPLORE → REMEMBER</text><text x="1150" y="498" text-anchor="end">SMALL FOOTPRINTS. LASTING STORIES.</text></g>
