    <text x="52" y="225" font-family="Georgia, 'Times New Roman', serif" font-size="45">Somewhere less</text>
    <text x="52" y="282" font-family="Georgia, 'Times New Roman', serif" font-size="53" font-style="italic" fill="#c44232">ordinary.</text>
    <text x="54" y="337" font-family="Arial, Helvetica, sans-serif" font-size="18">Beyond the guidebooks. Backed by sources.</text>
    <text x="54" y="366" font-family="Arial, Helvetica, sans-serif" font-size="18">Travel research powered by TinyFish.</text>
  </g>
